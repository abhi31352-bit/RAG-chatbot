# nginx config for the production frontend container.
#
# This is a separate file rather than a `RUN echo '...'` in the Dockerfile for
# two reasons: a config written by echo can only be validated once the
# container starts, whereas a real file can be checked at build time with
# `nginx -t` (see the Dockerfile), and quoting a multi-line nginx config
# through a shell is a good way to ship a backslash you did not intend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed responses, and enough room for a source-map-sized asset.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Server-sent events.
    #
    # `proxy_buffering off` is required, not an optimisation. The chat endpoint
    # streams answer tokens one `data:` frame at a time, and nginx's default
    # is to buffer the whole upstream response before forwarding. With buffering
    # left on, the typing animation the demo is built around does not animate:
    # deltas arrive in one lump the instant the model finishes, and the
    # response time is indistinguishable from the non-streaming endpoint.
    location /api/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # A stream may legitimately sit idle while the model thinks, so this
        # is a read timeout between chunks, not a cap on total response time.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Embedding and chat completions are billed network calls to a third
        # party. The default 60s would cut off a slow generation and surface
        # it to the presenter as an unexplained failure.
        proxy_read_timeout 120s;
        # A 50MB upload is the documented maximum, so the request body has to be
        # allowed to exceed nginx's 1MB default or every large document fails at
        # the proxy with a 413 the backend never sees.
        client_max_body_size 60m;
    }

    # Single-page app fallback.
    #
    # Without this, a hard refresh on /chat or /admin returns nginx's 404 --
    # the browser asks the server for that path, and only the *client* router
    # knows to render a page for it. This is the single most important line in
    # the file for a live demo, where reloading mid-talkout is likely.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change under the same name, so they can be
    # cached indefinitely. index.html must not be, or a deploy leaves browsers
    # holding a stale bundle that points at deleted asset files.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
